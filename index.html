<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Post Insight Analyser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f6;--panel:#fff;--ink:#14213d;--mute:#5d6882;--line:#d9dfea;--good:#0f8f7e;--warn:#b87710;--bad:#cf4352;--acc:#3d4fe0;--hl:#e3e7ff;--field:#f7f9fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--panel:#161e33;--ink:#e8ecf7;--mute:#94a0bd;--line:#2a3555;--good:#35c4ae;--warn:#e8a93a;--bad:#ef6b78;--acc:#8c98ff;--hl:#27315c;--field:#101730}}
:root[data-theme="dark"]{--bg:#0e1424;--panel:#161e33;--ink:#e8ecf7;--mute:#94a0bd;--line:#2a3555;--good:#35c4ae;--warn:#e8a93a;--bad:#ef6b78;--acc:#8c98ff;--hl:#27315c;--field:#101730}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,.num{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px;max-width:56ch}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card+.card{margin-top:18px}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
label{display:block;font-weight:500;margin:0 0 4px;font-size:14px}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:190px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row>div{flex:1 1 140px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 14px "IBM Plex Sans",sans-serif;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root:not([data-theme="light"]) button.pri{color:#0e1424}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.scorebox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none}
.ring text{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;fill:var(--ink)}
.verdict{font-size:22px;font-weight:600;margin:0}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:6px}
.stats b{color:var(--ink);font-weight:500}
.check{display:grid;grid-template-columns:12px 1fr auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.good .dot{background:var(--good)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}
.check .t{font-weight:500}
.check .pts{color:var(--mute);font-size:13px}
.check .tip{grid-column:2/4;color:var(--mute);font-size:14px}
.anat{white-space:pre-wrap;word-break:break-word;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;max-height:260px;overflow:auto}
mark{background:none;color:inherit;border-radius:3px;padding:0 2px}
mark.hook{background:var(--hl);box-shadow:inset 0 -2px 0 var(--acc)}
mark.tag{color:var(--acc);font-weight:500}
mark.men{color:var(--good);font-weight:500}
mark.url{color:var(--bad);text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
.er{font-size:36px;font-weight:800;line-height:1}
.empty{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Post Insight Analyser</h1>
  <p class="sub">Paste a draft or a published post. Get a score, what to fix, and how it measures up to the platform it's going on.</p>
  <div class="grid">
    <div>
      <div class="card">
        <h2>Your post</h2>
        <div class="row"><div><label for="plat">Platform</label>
          <select id="plat">
            <option value="x">X / Twitter</option><option value="ig">Instagram</option>
            <option value="li" selected>LinkedIn</option><option value="fb">Facebook</option><option value="tt">TikTok</option>
          </select></div></div>
        <label for="txt">Caption or post text</label>
        <textarea id="txt" placeholder="Paste your post here…"></textarea>
        <div class="btns" style="margin-top:10px">
          <button class="pri" id="ex">Try an example</button>
          <button id="clr">Clear</button>
        </div>
      </div>
      <div class="card">
        <h2>Results so far <span style="font-weight:400;color:var(--mute);font-size:14px">(optional)</span></h2>
        <div class="mgrid">
          <div><label for="m-reach">Reach</label><input id="m-reach" type="number" min="0" inputmode="numeric"></div>
          <div><label for="m-likes">Likes</label><input id="m-likes" type="number" min="0" inputmode="numeric"></div>
          <div><label for="m-com">Comments</label><input id="m-com" type="number" min="0" inputmode="numeric"></div>
          <div><label for="m-sh">Shares</label><input id="m-sh" type="number" min="0" inputmode="numeric"></div>
          <div><label for="m-sv">Saves</label><input id="m-sv" type="number" min="0" inputmode="numeric"></div>
        </div>
      </div>
    </div>
    <div>
      <div class="card" id="out"></div>
      <div class="card" id="perf" hidden></div>
    </div>
  </div>
</div>
<script>
const P={
  x:{n:'X',max:280,len:[70,200],tags:[0,2]},
  ig:{n:'Instagram',max:2200,len:[125,500],tags:[3,10]},
  li:{n:'LinkedIn',max:3000,len:[300,1300],tags:[2,5]},
  fb:{n:'Facebook',max:63206,len:[40,250],tags:[0,3]},
  tt:{n:'TikTok',max:2200,len:[40,300],tags:[3,6]}
};
const POS=/\b(love|great|amazing|excited|thrilled|proud|win|won|happy|thank|thanks|grateful|best|growth|success|learned|helpful|free|new|beautiful|joy|celebrate)\b/gi;
const NEG=/\b(hate|worst|terrible|awful|angry|fail|failed|sad|bad|never|problem|disappointed|annoying|scam|broken|lost|sorry|ugly)\b/gi;
const CTA=/\b(comment|share|follow|subscribe|click|tap|link in bio|dm me|dm us|reply|tell me|let me know|join|sign up|save this|tag a|what do you think|thoughts\?|agree\?|drop a|try it)\b/i;
const POWER=/\b(secret|mistake|why|how|stop|truth|nobody|never|before|after|lesson|free|proven|new|finally|warning|hack)\b/i;
const WEAK=/^(hi|hello|hey|so|just|today i|i just wanted|good morning)\b/i;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const status=(f)=>f>=1?'good':f>=.5?'warn':'bad';

function analyse(text,key){
  const p=P[key], chars=[...text].length;
  const words=(text.match(/\S+/g)||[]).length;
  const tags=(text.match(/#[\p{L}\d_]+/gu)||[]).length;
  const emojis=(text.match(/\p{Extended_Pictographic}/gu)||[]).length;
  const urls=(text.match(/https?:\/\/\S+/g)||[]).length;
  const sentences=Math.max(1,(text.replace(/https?:\/\/\S+/g,'').match(/[^.!?\n]+[.!?]*/g)||[]).filter(s=>s.trim().length>2).length);
  const wps=words/sentences;
  const first=text.trim().split('\n')[0]||'';
  const pos=(text.match(POS)||[]).length, neg=(text.match(NEG)||[]).length;
  const caps=(text.match(/\b[A-Z]{4,}\b/g)||[]).length;
  const c=[];

  // Length
  let f,tip;
  if(chars>p.max){f=0;tip=`${chars-p.max} characters over the ${p.max} limit. Cut or split into a thread.`}
  else if(chars<p.len[0]){f=.5;tip=`Short for ${p.n}. Posts of ${p.len[0]}–${p.len[1]} characters tend to give readers enough to react to.`}
  else if(chars>p.len[1]){f=.5;tip=`Longer than the ${p.len[0]}–${p.len[1]} sweet spot. Fine if every line earns its place; otherwise trim.`}
  else{f=1;tip=`Inside the ${p.len[0]}–${p.len[1]} character sweet spot for ${p.n}.`}
  c.push({t:'Length',m:20,f,tip:tip});

  // Hook
  let h=0;const hn=[];
  if(first.length&&first.length<=100)h++;else hn.push('shorten the first line to under 100 characters');
  if(/\?|\d/.test(first)||POWER.test(first))h++;else hn.push('add a question, a number, or a curiosity word');
  if(first&&!WEAK.test(first.trim()))h++;else hn.push('skip filler openers like "Hi" or "Just wanted to"');
  f=h/3;
  c.push({t:'Opening line',m:20,f,tip:h===3?'Short, specific, and gives a reason to keep reading.':'To strengthen the hook: '+hn.join('; ')+'.'});

  // CTA
  const hasCta=CTA.test(text);
  c.push({t:'Call to action',m:15,f:hasCta?1:0,tip:hasCta?'You ask readers to do something specific.':'No clear ask. End with one action: comment, save, share, or follow.'});

  // Hashtags
  if(tags<p.tags[0]){f=.5;tip=`${tags} hashtags. Aim for ${p.tags[0]}–${p.tags[1]} on ${p.n}.`}
  else if(tags>p.tags[1]){f=tags>p.tags[1]+4?0:.5;tip=`${tags} hashtags is more than ${p.n} rewards. Keep the ${p.tags[1]} most relevant.`}
  else{f=1;tip=`${tags} hashtags is a good count for ${p.n}.`}
  if(p.tags[0]===0&&tags===0){f=1;tip=`No hashtags is fine on ${p.n}.`}
  c.push({t:'Hashtags',m:10,f,tip});

  // Readability
  const wall=chars>400&&!/\n/.test(text);
  if(wps<=18&&!wall){f=1;tip=`About ${wps.toFixed(0)} words per sentence. Easy to scan.`}
  else if(wall){f=.5;tip='A long block of text with no line breaks. Add white space every 1–2 sentences.'}
  else{f=wps<=25?.5:0;tip=`Sentences average ${wps.toFixed(0)} words. Split the long ones.`}
  c.push({t:'Readability',m:10,f,tip});

  // Tone
  let tone='neutral';if(pos>neg+0)tone='positive';if(neg>pos)tone='negative';
  if(caps>2){f=.5;tip=`${caps} ALL-CAPS words read as shouting. Keep it to one or two.`}
  else if(tone==='negative'&&neg>=3){f=.5;tip='Mostly negative wording. Fine for a hard truth, but pair it with a takeaway.'}
  else{f=1;tip=`Reads as ${tone}. No tone problems found.`}
  c.push({t:'Tone',m:10,f,tip});

  // Question
  const q=/\?/.test(text);
  c.push({t:'Invites replies',m:5,f:q?1:.5,tip:q?'A question gives people an easy way to comment.':'Add a question to make commenting effortless.'});

  // Emojis + links combined feedback separate
  const emax=key==='li'||key==='x'?3:8;
  c.push({t:'Emojis',m:5,f:emojis<=emax?1:.5,tip:emojis<=emax?`${emojis} emoji${emojis===1?'':'s'}. Balanced.`:`${emojis} emojis is heavy for ${p.n}. Keep the ones that add meaning.`});

  const linkWarn=urls>0;
  c.push({t:'Links',m:5,f:linkWarn?(key==='ig'||key==='tt'?0:.5):1,
    tip:!linkWarn?'No links in the body, which keeps reach intact.':(key==='ig'||key==='tt'?'Links aren\u2019t clickable in captions here. Use the bio link instead.':'Outbound links can lower reach. Consider putting it in the first comment.')});

  const score=Math.round(c.reduce((a,x)=>a+x.m*x.f,0));
  return{c,score,chars,words,tags,emojis,urls,tone,p};
}

function anatomy(text){
  const lines=text.split('\n');
  const mk=s=>esc(s).replace(/(https?:\/\/[^\s]+)|(#[\p{L}\d_]+)|(@[\w.]+)/gu,(m,u,t,a)=>u?`<mark class="url">${m}</mark>`:t?`<mark class="tag">${m}</mark>`:`<mark class="men">${m}</mark>`);
  const i=lines.findIndex(l=>l.trim());
  return lines.map((l,n)=>n===i?`<mark class="hook">${mk(l)}</mark>`:mk(l)).join('\n');
}

function render(){
  const text=$('txt').value, key=$('plat').value, out=$('out');
  if(!text.trim()){out.innerHTML='<h2>Analysis</h2><p class="empty">Your score and suggestions will appear here as you type. Paste a post or try the example.</p>';return}
  const r=analyse(text,key);
  const col=r.score>=75?'var(--good)':r.score>=50?'var(--warn)':'var(--bad)';
  const verdict=r.score>=85?'Ready to post':r.score>=70?'Strong, with room to tighten':r.score>=50?'Needs a few fixes':'Rework before posting';
  const circ=2*Math.PI*54, off=circ*(1-r.score/100);
  const rt=Math.max(1,Math.round(r.words/200*60));
  out.innerHTML=`
  <h2>Analysis for ${r.p.n}</h2>
  <div class="scorebox">
    <svg class="ring" viewBox="0 0 132 132" role="img" aria-label="Score ${r.score} out of 100">
      <circle cx="66" cy="66" r="54" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="66" cy="66" r="54" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 66 66)"/>
      <text x="66" y="66" text-anchor="middle" dominant-baseline="central">${r.score}</text>
    </svg>
    <div>
      <p class="verdict">${verdict}</p>
      <div class="stats"><span><b>${r.chars}</b> characters</span><span><b>${r.words}</b> words</span><span><b>${r.tags}</b> hashtags</span><span><b>${r.emojis}</b> emojis</span><span><b>${rt}s</b> read</span></div>
    </div>
  </div>
  <div style="margin-top:14px">
  ${r.c.map(x=>`<div class="check ${status(x.f)}"><span class="dot"></span><span class="t">${x.t}</span><span class="pts">${Math.round(x.m*x.f)}/${x.m}</span><span class="tip">${x.tip}</span></div>`).join('')}
  </div>
  <h2 style="margin-top:18px">Post anatomy</h2>
  <div class="anat">${anatomy(text)}</div>
  <div class="legend"><span><mark class="hook">Opening line</mark></span><span><mark class="tag">#hashtag</mark></span><span><mark class="men">@mention</mark></span><span><mark class="url">link</mark></span></div>`;
}

function perf(){
  const n=id=>Math.max(0,parseFloat($(id).value)||0);
  const reach=n('m-reach'),l=n('m-likes'),c=n('m-com'),s=n('m-sh'),v=n('m-sv');
  const box=$('perf');
  if(!reach||(l+c+s+v)===0){box.hidden=true;return}
  const tot=l+c+s+v, er=tot/reach*100;
  const lvl=er>=6?['Excellent','var(--good)']:er>=3?['Good','var(--good)']:er>=1?['Average','var(--warn)']:['Low','var(--bad)'];
  const pct=x=>(x/tot*100).toFixed(0)+'%';
  const strongest=[['likes',l],['comments',c],['shares',s],['saves',v]].sort((a,b)=>b[1]-a[1])[0][0];
  let note=`Most of the engagement came from ${strongest}.`;
  if(s+v>l*.3)note+=' A high share and save rate means people found it worth keeping.';
  else if(c>l*.1)note+=' A strong comment rate suggests the post started a conversation.';
  else if(l>0&&c+s+v<l*.05)note+=' Plenty of passive likes but few deeper actions. A sharper call to action could help.';
  box.hidden=false;
  box.innerHTML=`<h2>Performance</h2>
  <div class="scorebox"><div><div class="er num" style="color:${lvl[1]}">${er.toFixed(2)}%</div><div class="stats"><span>engagement rate</span></div></div>
  <div><p class="verdict">${lvl[0]}</p><div class="stats"><span>Likes <b>${pct(l)}</b></span><span>Comments <b>${pct(c)}</b></span><span>Shares <b>${pct(s)}</b></span><span>Saves <b>${pct(v)}</b></span></div></div></div>
  <p style="margin:12px 0 0;color:var(--mute);font-size:14px">${note} Rate is total interactions divided by reach. Benchmarks are rough: under 1% low, 1–3% average, 3–6% good, over 6% excellent.</p>`;
}

const EX=`Most LinkedIn posts fail in the first line. Here's what I changed after 90 days of testing.\n\nI used to open with "Excited to share…" and got a handful of likes. Now I lead with the result, then the lesson.\n\nThree changes that doubled my reach:\n1. Open with a number\n2. Keep sentences short\n3. End with one question\n\nWhat's the first line that made you stop scrolling? Tell me in the comments.\n\n#contentstrategy #linkedintips #copywriting`;
$('txt').addEventListener('input',render);
$('plat').addEventListener('change',render);
['m-reach','m-likes','m-com','m-sh','m-sv'].forEach(id=>$(id).addEventListener('input',perf));
$('ex').onclick=()=>{$('txt').value=EX;$('plat').value='li';render()};
$('clr').onclick=()=>{$('txt').value='';['m-reach','m-likes','m-com','m-sh','m-sv'].forEach(id=>$(id).value='');render();perf()};
render();
</script>
</body>
</html>
